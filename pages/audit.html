<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="../css/preferences.css">
<script src="../js/preferences.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Audit Trail | PPDM Admin</title>

<link rel="stylesheet" href="../css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --at-primary: #F5A623;
    --at-secondary: #ff4e54;
    --at-background: #EEF0F3;
    --at-card: #FFFFFF;
    --at-text: #1A2B4C;
    --at-muted: #6B7280;
    --at-border: #E5E7EB;
}

/* Page */
body {
    background: var(--at-background);
}

.content {
    background: var(--at-background);
    min-height: 100vh;
}

.at-brand {
    display: grid;
    place-items: center;
    min-width: 35px;
    height: 35px;
    font-size: 25px;
}

.at-placeholder {
    opacity: .5;
    cursor: default !important;
}

/* Header */
.at-page-heading h1 {
    color: var(--at-text);
    font-weight: 800;
}

.at-page-heading h3 {
    color: var(--at-muted);
    font-weight: 400;
}

.at-refresh {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 10px 18px;
    border: 2px solid var(--at-primary);
    border-radius: 9px;
    background: #fff;
    color: var(--at-text);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s, transform .2s;
}

.at-refresh:hover {
    background: #fff6e4;
    transform: translateY(-1px);
}

.at-refresh:disabled {
    opacity: .5;
    cursor: wait;
}

/* Audit Panel */
.at-panel {
    overflow: visible;
    padding: 0;
    border: 1px solid var(--at-border);
    border-radius: 14px;
    background: var(--at-card);
    box-shadow: 0 4px 20px rgba(26, 43, 76, .055);
}

.at-panel-heading {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--at-border);
    background: linear-gradient(90deg, #fff8e9, #fff);
    border-radius: 14px 14px 0 0;
}

.at-panel-indicator {
    width: 5px;
    height: 30px;
    border-radius: 5px;
    background: var(--at-primary);
}

.at-panel-heading h2 {
    margin: 0;
    color: var(--at-text);
    font-size: 15px;
    font-weight: 800;
}

.at-panel-heading p {
    margin: 4px 0 0;
    color: var(--at-muted);
    font-size: 12px;
}

/* Table */
.at-table-wrap {
    width: 100%;
    overflow-x: auto;
}

.audit-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}

.audit-table th {
    padding: 15px 17px;
    border-bottom: 2px solid #f4e2bd;
    background: #FFF9ED;
    color: var(--at-text);
    font-size: 12px;
    font-weight: 800;
    text-align: left;
    text-transform: uppercase;
    white-space: nowrap;
}

.audit-table td {
    padding: 16px 17px;
    border-bottom: 1px solid var(--at-border);
    color: var(--at-text);
    font-size: 13px;
    vertical-align: middle;
}

.audit-table tbody tr:nth-child(even) {
    background: #FAFBFD;
}

.audit-table tbody tr:hover {
    background: #FFF8E9;
}

.audit-table tbody tr:last-child td {
    border-bottom: 0;
}

/* Time */
.at-time-header {
    position: relative;
}

.at-time-trigger {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--at-text);
    font: inherit;
    font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
}

.at-arrow {
    color: #A57A24;
    font-size: 11px;
}

.at-time-menu {
    display: none;
    position: absolute;
    top: calc(100% - 1px);
    left: 10px;
    z-index: 100;
    min-width: 170px;
    padding: 6px;
    border: 1px solid var(--at-border);
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 10px 30px rgba(26,43,76,.15);
    text-transform: none;
}

.at-time-menu.open {
    display: block;
}

.at-time-option {
    display: block;
    width: 100%;
    padding: 11px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--at-text);
    font-size: 12px;
    text-align: left;
    cursor: pointer;
}

.at-time-option:hover {
    background: #FFF6E4;
}

.at-time-option.selected {
    background: #FFF0CC;
    color: #8D5D00;
    font-weight: 800;
}

.at-time-value {
    color: var(--at-muted) !important;
    white-space: nowrap;
    font-size: 12px !important;
}

/* User */
.at-user {
    font-weight: 700;
    color: var(--at-text);
    overflow-wrap: anywhere;
}

/* Action */
.at-action {
    display: inline-block;
    padding: 7px 11px;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
}

.at-action.create {
    background: #E7F6ED;
    color: #237447;
}

.at-action.update {
    background: #FFF0CC;
    color: #916100;
}

.at-action.delete {
    background: #FFE8EA;
    color: #C03945;
}

.at-action.other {
    background: #EAF0FA;
    color: #46658D;
}

/* Module */
.at-module {
    display: inline-block;
    padding: 7px 10px;
    border: 1px solid #E5E7EB;
    border-radius: 7px;
    background: #F5F6F8;
    color: #40516B;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
}

/* Description */
.at-description {
    color: #4B5563 !important;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

/* Empty */
.at-empty {
    padding: 45px 15px !important;
    color: var(--at-muted) !important;
    text-align: center;
}

/* Mobile */
.at-mobile-menu {
    display: none;
}

@media(min-width:769px) {
    .sidebar.collapsed:hover {
        width: 250px;
    }

    .sidebar.collapsed:hover .sidebar-title,
    .sidebar.collapsed:hover .text {
        opacity: 1;
        width: auto;
    }
}

@media(max-width:768px) {
    .at-mobile-menu {
        display: block;
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1002;
        padding: 8px 12px;
        border: 1px solid var(--at-border);
        border-radius: 9px;
        background: #fff;
        font-size: 20px;
    }

    .dashboard-header {
        padding-top: 35px;
    }

    .sidebar.mobile-open {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 250px;
        height: 100vh;
        z-index: 1001;
    }

    .sidebar.mobile-open .sidebar-title,
    .sidebar.mobile-open .text {
        opacity: 1;
        width: auto;
    }

    .audit-table {
        min-width: 850px;
    }

    .at-panel-heading {
        padding: 15px;
    }
}
</style>
</head>

<body>

<aside class="sidebar collapsed" id="sidebar">
    <div class="sidebar-header">
        <span class="at-brand" title="PPDM Market">🏬</span>
        <h2 class="sidebar-title">PPDM ADMIN</h2>
    </div>

    <ul>
        <li onclick="location.href='dashboard.html'">
            <span class="icon">🏠</span>
            <span class="text">Dashboard</span>
        </li>

        <li onclick="location.href='requests.html'">
            <span class="icon">📄</span>
            <span class="text">Seller Requests</span>
        </li>

        <li onclick="location.href='users.html'">
            <span class="icon">👥</span>
            <span class="text">Users</span>
        </li>

        <li onclick="location.href='marketPrice.html'">
            <span class="icon">💰</span>
            <span class="text">Market Price</span>
        </li>

        <li onclick="location.href='products.html'">
            <span class="icon">📦</span>
            <span class="text">Product Listings</span>
        </li>

        <li class="active">
            <span class="icon">📜</span>
            <span class="text">Audit Trail</span>
        </li>

        <li class="at-placeholder">
            <span class="icon">⚙️</span>
            <span class="text">Settings</span>
        </li>

        <li onclick="logout()">
            <span class="icon">🚪</span>
            <span class="text">Logout</span>
        </li>
    </ul>
</aside>

<button
    class="at-mobile-menu"
    id="atMobileMenu"
    type="button"
    aria-label="Open Menu"
>☰</button>

<main class="content collapsed-content">

    <div class="dashboard-header">
        <div class="at-page-heading">
            <h1>Audit Trail</h1>
            <h3>System Activity Logs</h3>
        </div>

        <button
            class="at-refresh"
            id="atRefresh"
            type="button"
            onclick="loadAuditLogs()"
        >
            Refresh
        </button>
    </div>

    <div class="at-panel">

        <div class="at-panel-heading">
            <div class="at-panel-indicator"></div>
            <div>
                <h2>Activity History</h2>
                <p>Recorded System Actions</p>
            </div>
        </div>

        <div class="at-table-wrap">
            <table class="audit-table">
                <thead>
                    <tr>
                        <th class="at-time-header">
                            <button
                                class="at-time-trigger"
                                id="atTimeTrigger"
                                type="button"
                                aria-expanded="false"
                            >
                                Time
                                <span class="at-arrow">▾</span>
                            </button>

                            <div class="at-time-menu" id="atTimeMenu">
                                <button
                                    class="at-time-option selected"
                                    type="button"
                                    data-order="desc"
                                >
                                    Newest First
                                </button>

                                <button
                                    class="at-time-option"
                                    type="button"
                                    data-order="asc"
                                >
                                    Oldest First
                                </button>
                            </div>
                        </th>

                        <th>User</th>
                        <th>Action</th>
                        <th>Module</th>
                        <th>Description</th>
                    </tr>
                </thead>

                <tbody id="auditTableBody">
                    <tr>
                        <td colspan="5" class="at-empty">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</main>

<script src="../js/supabase.js"></script>
<script src="../js/script.js"></script>
<script src="../js/audit.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const sidebar = document.getElementById("sidebar");
    const menuButton = document.getElementById("atMobileMenu");

    menuButton.addEventListener("click", event => {
        event.stopPropagation();
        sidebar.classList.toggle("mobile-open");
    });

    document.addEventListener("click", event => {
        if (
            window.innerWidth <= 768 &&
            !sidebar.contains(event.target) &&
            event.target !== menuButton
        ) {
            sidebar.classList.remove("mobile-open");
        }
    });
});
</script>

</body>
</html>
