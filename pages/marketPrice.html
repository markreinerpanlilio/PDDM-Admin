<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Price</title>

    <link rel="stylesheet" href="../css/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="sidebar collapsed" id="sidebar">
    <div class="sidebar-header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h2 class="sidebar-title">PDDM ADMIN</h2>
    </div>

    <ul>
        <li onclick="window.location='dashboard.html'">
            <span class="icon">🏠</span>
            <span class="text">Dashboard</span>
        </li>

        <li onclick="window.location='requests.html'">
            <span class="icon">📄</span>
            <span class="text">Requests</span>
        </li>

        <li class="active">
            <span class="icon">💰</span>
            <span class="text">Market Price</span>
        </li>

        <li onclick="window.location='audit.html'">
            <span class="icon">📜</span>
            <span class="text">Audit Trail</span>
        </li>

        <li onclick="logout()">
            <span class="icon">🚪</span>
            <span class="text">Logout</span>
        </li>
    </ul>
</div>

<div class="content collapsed-content" id="content">

    <div class="dashboard-header">
        <h1>Market Price</h1>

        <button class="refresh-btn" onclick="loadMarketPrices()">
            Refresh
        </button>
    </div>

    <div class="panel full-panel">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">

            <input
                type="text"
                id="searchPrice"
                placeholder="Search product..."
                onkeyup="searchMarketPrice()"
                style="width:300px;">

            <button
                class="approve-btn"
                onclick="openAddModal()">

                + Add Product

            </button>

        </div>

        <table class="audit-table">

            <thead>

            <tr>

                <th>Product</th>
                <th>Variant</th>
                <th>Unit</th>
                <th>SRP</th>
                <th>Rule</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody id="marketPriceTable"></tbody>

        </table>

    </div>

</div>

<script src="../js/supabase.js"></script>
<script src="../js/script.js"></script>
<script src="../js/marketPrice.js"></script>

</body>
</html>
