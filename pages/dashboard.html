<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDDM Admin Dashboard</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-top-layout{
            display:grid;
            grid-template-columns:minmax(0,2fr) minmax(0,3fr);
            gap:20px;
            align-items:stretch;
            margin-bottom:24px;
        }
        .dashboard-summary-grid{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            grid-template-rows:repeat(2,minmax(130px,1fr));
            gap:20px;
            min-width:0;
        }
        .dashboard-summary-grid .card{
            min-width:0;
            min-height:130px;
            margin:0;
        }
        .dashboard-notifications{
            min-width:0;
            min-height:280px;
            height:100%;
            box-sizing:border-box;
            display:flex;
            flex-direction:column;
        }
        .dashboard-notifications-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:12px;
            flex-wrap:wrap;
            margin-bottom:12px;
        }
        .dashboard-notifications-header h2{margin:0}
        .notification-count{
            padding:6px 12px;
            border-radius:20px;
            background:var(--accent-soft);
            color:var(--accent-dark);
            font-size:12px;
            font-weight:700;
            white-space:nowrap;
        }
        .dashboard-notification-list{
            list-style:none;
            padding:0;
            margin:0;
            overflow-y:auto;
            flex:1;
        }
        .dashboard-notification-list li{
            display:flex;
            align-items:flex-start;
            gap:12px;
            padding:15px 4px;
            border-bottom:1px solid var(--border);
        }
        .dashboard-notification-list li:last-child{border-bottom:none}
        .notification-dot{
            width:10px;
            height:10px;
            min-width:10px;
            margin-top:5px;
            border-radius:50%;
            background:var(--accent);
        }
        .notification-details{min-width:0;flex:1}
        .notification-title{
            font-size:13px;
            font-weight:700;
            color:var(--text);
            overflow-wrap:anywhere;
        }
        .notification-message{
            font-size:12px;
            color:var(--text-muted);
            margin-top:5px;
            overflow-wrap:anywhere;
        }
        .notification-time{
            font-size:11px;
            color:var(--text-muted);
            margin-top:6px;
        }
        .notification-empty{
            padding:30px 10px;
            text-align:center;
            color:var(--text-muted);
            font-size:13px;
        }
        .dashboard-notification-list li.unread{background:var(--accent-soft)}
        @media(max-width:1200px){
            .dashboard-top-layout{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
            .dashboard-summary-grid{gap:12px;grid-template-rows:repeat(2,minmax(120px,1fr))}
        }
        @media(max-width:768px){
            .dashboard-top-layout{grid-template-columns:1fr}
            .dashboard-summary-grid{grid-template-rows:repeat(2,minmax(120px,1fr))}
            .dashboard-notifications{min-height:280px}
            .sidebar.mobile-open{
                display:block;
                position:fixed;
                inset:0 auto 0 0;
                width:250px;
                z-index:1000;
            }
        }
        @media(max-width:420px){
            .dashboard-summary-grid{gap:10px}
            .dashboard-summary-grid .card{padding:14px}
            .dashboard-summary-grid .card h2{font-size:14px}
        }
    </style>
</head>
<body>
    <div class="sidebar collapsed" id="sidebar">
        <div class="sidebar-header">
            <button class="menu-btn" id="menuBtn" type="button" onclick="toggleSidebar()" aria-label="Toggle sidebar">☰</button>
            <h2 class="sidebar-title">PDDM ADMIN</h2>
        </div>
        <ul>
            <li class="active"><span class="icon">🏠</span><span class="text">Dashboard</span></li>
            <li onclick="window.location='requests.html'"><span class="icon">📄</span><span class="text">Requests</span></li>
            <li onclick="window.location='marketPrice.html'"><span class="icon">💰</span><span class="text">Market Price</span></li>
            <li onclick="window.location='audit.html'"><span class="icon">📜</span><span class="text">Audit Trail</span></li>
            <li onclick="logout()"><span class="icon">🚪</span><span class="text">Logout</span></li>
        </ul>
    </div>

    <div class="content collapsed-content" id="content">
        <div class="dashboard-header">
            <div>
                <h1>Dashboard</h1>
                <h3 id="welcome"></h3>
            </div>
            <div class="header-actions">
                <select id="dateFilter">
                    <option value="today">Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                    <option value="year">This Year</option>
                </select>
                <button class="refresh-btn" type="button" onclick="refreshDashboard()">Refresh</button>
            </div>
        </div>

        <div class="dashboard-top-layout">
            <div class="dashboard-summary-grid">
                <div class="card">
                    <h2>Customers</h2>
                    <h1 id="customerCount">0</h1>
                </div>
                <div class="card">
                    <h2>Sellers</h2>
                    <h1 id="sellerCount">0</h1>
                </div>
                <div class="card">
                    <h2>Active Customers</h2>
                    <h1 id="activeCustomerCount">0</h1>
                </div>
                <div class="card">
                    <h2>Active Sellers</h2>
                    <h1 id="activeSellerCount">0</h1>
                </div>
            </div>

            <div class="panel dashboard-notifications">
                <div class="dashboard-notifications-header">
                    <h2>Notifications</h2>
                    <span class="notification-count" id="unreadNotificationCount">Unread: 0</span>
                </div>
                <ul class="dashboard-notification-list" id="dashboardNotificationList">
                    <li class="notification-empty">Loading notifications...</li>
                </ul>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="panel large-panel">
                <h2>User Growth</h2>
                <div class="chart-container"><canvas id="userGrowthChart"></canvas></div>
            </div>
            <div class="panel">
                <h2>Price Compliance</h2>
                <div class="chart-container"><canvas id="priceComplianceChart"></canvas></div>
            </div>
        </div>

        <div class="panel full-panel">
            <h2>Market Activity</h2>
            <div class="chart-container large-chart"><canvas id="marketActivityChart"></canvas></div>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script src="../js/script.js"></script>
    <script>
        const sidebar=document.getElementById("sidebar");
        const content=document.getElementById("content");
        const notificationList=document.getElementById("dashboardNotificationList");
        const unreadCount=document.getElementById("unreadNotificationCount");

        window.toggleSidebar=function(){
            if(window.innerWidth<=768){
                sidebar.classList.toggle("mobile-open");
                return;
            }

            const collapsed=sidebar.classList.toggle("collapsed");
            content.classList.toggle("collapsed-content",collapsed);
            content.classList.toggle("expanded-content",!collapsed);
        };

        window.refreshDashboard=async function(){
            if(typeof window.loadDashboard==="function"){
                await window.loadDashboard();
            }
            await loadDashboardNotifications();
        };

        function escapeHTML(value){
            return String(value??"").replace(/[&<>"']/g,char=>({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"
            })[char]);
        }

        function formatNotificationTime(value){
            if(!value)return "";
            const date=new Date(value);
            if(Number.isNaN(date.getTime()))return "";
            return date.toLocaleString([],{
                month:"short",
                day:"numeric",
                hour:"numeric",
                minute:"2-digit"
            });
        }

        async function loadDashboardNotifications(){
            if(typeof db==="undefined"){
                notificationList.innerHTML='<li class="notification-empty">Unable to connect to notifications.</li>';
                return;
            }

            try{
                const {data:{user},error:userError}=await db.auth.getUser();

                if(userError)throw userError;

                if(!user){
                    unreadCount.textContent="Unread: 0";
                    notificationList.innerHTML='<li class="notification-empty">Sign in to view your notifications.</li>';
                    return;
                }

                const [unreadResult,recentResult]=await Promise.all([
                    db.from("notifications")
                        .select("id",{count:"exact",head:true})
                        .eq("user_id",user.id)
                        .eq("is_read",false),
                    db.from("notifications")
                        .select("id,title,message,is_read,created_at")
                        .eq("user_id",user.id)
                        .order("created_at",{ascending:false})
                        .limit(6)
                ]);

                if(unreadResult.error)throw unreadResult.error;
                if(recentResult.error)throw recentResult.error;

                unreadCount.textContent="Unread: "+(unreadResult.count||0);

                const notifications=recentResult.data||[];

                if(!notifications.length){
                    notificationList.innerHTML='<li class="notification-empty">You have no notifications yet.</li>';
                    return;
                }

                notificationList.innerHTML=notifications.map(item=>`
                    <li class="${item.is_read?"":"unread"}">
                        <span class="notification-dot"></span>
                        <div class="notification-details">
                            <div class="notification-title">${escapeHTML(item.title||"Notification")}</div>
                            <div class="notification-message">${escapeHTML(item.message||"")}</div>
                            <div class="notification-time">${escapeHTML(formatNotificationTime(item.created_at))}</div>
                        </div>
                    </li>
                `).join("");
            }catch(error){
                console.error("Dashboard notifications error:",error.message);
                notificationList.innerHTML='<li class="notification-empty">Could not load notifications. Check your connection and permissions.</li>';
            }
        }

        document.getElementById("welcome").textContent=
            "Welcome, "+(localStorage.getItem("adminName")||"Admin");

        if(typeof window.loadDashboard==="function")window.loadDashboard();
        if(typeof window.initializeCharts==="function")window.initializeCharts();

        loadDashboardNotifications();

        document.getElementById("dateFilter").addEventListener("change",()=>{
            if(typeof window.loadDashboard==="function")window.loadDashboard();
        });

        if(typeof db!=="undefined"){
            db.auth.getUser().then(({data:{user}})=>{
                if(!user)return;
                db.channel("admin-dashboard-notifications")
                    .on("postgres_changes",{
                        event:"*",
                        schema:"public",
                        table:"notifications",
                        filter:"user_id=eq."+user.id
                    },loadDashboardNotifications)
                    .subscribe();
            }).catch(error=>console.error("Notification subscription error:",error.message));
        }

        document.addEventListener("click",event=>{
            if(window.innerWidth<=768&&sidebar.classList.contains("mobile-open")&&
                !sidebar.contains(event.target)&&!event.target.closest("#menuBtn")){
                sidebar.classList.remove("mobile-open");
            }
        });
    </script>
</body>
</html>
