
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Requests</title>

    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Request table enhancements only */
        .request-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .request-table thead th {
            padding: 16px 14px;
            text-align: left;
            white-space: nowrap;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: #777;
            background: #f8f8f8;
            border-bottom: 1px solid #e9e9e9;
        }

        .request-table thead th:first-child {
            border-top-left-radius: 8px;
        }

        .request-table thead th:last-child {
            border-top-right-radius: 8px;
        }

        .request-table tbody td {
            padding: 16px 14px;
            border-bottom: 1px solid #eeeeee;
            vertical-align: middle;
            font-size: 13px;
        }

        .request-table tbody tr {
            transition: background-color 0.2s ease;
        }

        .request-table tbody tr:hover {
            background-color: #fffaf0;
        }

        .request-table tbody tr:last-child td {
            border-bottom: none;
        }

        .request-applicant {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 150px;
        }

        .request-avatar {
            width: 36px;
            height: 36px;
            min-width: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #fff0c2;
            color: #8a6200;
            font-size: 14px;
            font-weight: 700;
        }

        .request-applicant-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .request-applicant-name {
            color: #292929;
            font-weight: 600;
        }

        .request-applicant-label {
            color: #999;
            font-size: 11px;
        }

        .request-email {
            overflow-wrap: anywhere;
        }

        .request-date {
            white-space: nowrap;
        }

        .request-stall-badge {
            display: inline-block;
            padding: 7px 10px;
            border-radius: 7px;
            background: #f1f1f1;
            color: #444;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .request-actions {
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }

        .request-actions button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: transform 0.18s ease, background-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        .request-view-btn {
            padding: 9px 11px;
            border-radius: 7px;
            background: #f1f1f1;
            color: #333;
            font-size: 12px;
            font-weight: 600;
        }

        .request-view-btn:hover:not(:disabled) {
            background: #e4e4e4;
        }

        .request-view-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .request-action-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.06);
        }

        .request-approve-btn {
            background: #e1f6e8;
            color: #168044;
        }

        .request-approve-btn:hover {
            background: #c8efd6;
            box-shadow: 0 3px 8px rgba(22, 128, 68, 0.15);
            transform: translateY(-1px);
        }

        .request-reject-btn {
            background: #ffe5e5;
            color: #c62828;
        }

        .request-reject-btn:hover {
            background: #ffd0d0;
            box-shadow: 0 3px 8px rgba(198, 40, 40, 0.15);
            transform: translateY(-1px);
        }

        .request-empty-message {
            padding: 35px 20px !important;
            text-align: center;
            color: #888;
        }

        .request-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .request-empty-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            margin-bottom: 3px;
            border-radius: 50%;
            background: #e1f6e8;
            color: #168044;
            font-size: 21px;
            font-weight: 700;
        }

        .request-empty-state strong {
            color: #333;
            font-size: 14px;
        }

        .request-table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        /* Permit viewer */
        .permit-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.65);
        }

        .permit-modal-box {
            width: min(650px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            padding: 22px;
            box-sizing: border-box;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .permit-modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
        }

        .permit-modal-header h2 {
            margin: 0 0 7px;
            font-size: 20px;
        }

        .permit-applicant-info {
            color: #777;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .permit-close-btn {
            width: 35px;
            height: 35px;
            flex-shrink: 0;
            border: none;
            border-radius: 8px;
            background: #f1f1f1;
            color: #333;
            font-size: 22px;
            cursor: pointer;
        }

        .permit-image-area {
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            background: #f7f7f7;
        }

        #permitImage {
            display: none;
            width: 100%;
            max-height: 65vh;
            object-fit: contain;
        }

        #permitLoading {
            padding: 30px;
            text-align: center;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .request-table {
                min-width: 950px;
            }
        }
    </style>
</head>

<body>

<div class="sidebar collapsed" id="sidebar">

    <div class="sidebar-header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h2 class="sidebar-title">PDDM ADMIN</h2>
    </div>

    <ul>
        <li onclick="window.location='dashboard.html'">
            <span class="icon">🏠</span>
            <span class="text">Dashboard</span>
        </li>

        <li class="active">
            <span class="icon">📄</span>
            <span class="text">Requests</span>
        </li>

        <li onclick="window.location='marketPrice.html'">
            <span class="icon">💰</span>
            <span class="text">Market Price</span>
        </li>

        <li onclick="window.location='audit.html'">
            <span class="icon">📜</span>
            <span class="text">Audit Trail</span>
        </li>

        <li onclick="logout()">
            <span class="icon">🚪</span>
            <span class="text">Logout</span>
        </li>
    </ul>

</div>

<div class="content collapsed-content" id="content">

    <div class="dashboard-header">

        <div>
            <h1>Seller Applications</h1>
            <h3 id="pendingCount">Loading...</h3>
        </div>

        <input
            type="text"
            id="searchRequest"
            placeholder="Search applicant..."
            oninput="searchRequests()">

    </div>

    <div class="panel">

        <div class="request-table-wrap">
            <table class="request-table">

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Registered</th>
                        <th>Requested Stall</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="requestTable">
                    <tr>
                        <td colspan="6" class="request-empty-message">
                            Loading applications...
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>

    </div>

</div>

<div
    id="permitModal"
    class="permit-modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="permitModalTitle">

    <div class="permit-modal-box">

        <div class="permit-modal-header">
            <div>
                <h2 id="permitModalTitle">Business Permit</h2>
                <div id="permitApplicantInfo" class="permit-applicant-info"></div>
            </div>

            <button
                type="button"
                class="permit-close-btn"
                onclick="closePermitModal()"
                aria-label="Close permit viewer">×</button>
        </div>

        <div class="permit-image-area">
            <div id="permitLoading">Loading permit photo...</div>
            <img id="permitImage" alt="Seller's submitted business permit">
        </div>

    </div>
</div>

<script src="../js/supabase.js"></script>
<script src="../js/script.js"></script>
<script src="../js/request.js"></script>

</body>
</html>
